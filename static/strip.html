<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Recorder — Strip</title>
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; font-family: var(--font-mono);
    background: #06080c; color: #fff; user-select: none;
  }
  [hidden] { display: none !important; }   /* beats the display:flex rules below */

  /* "hide overlay" setting → clean camera feed (app keeps running) */
  #strip.overlay-off #topstack,
  #strip.overlay-off #botband,
  #strip.overlay-off #hudchrome,
  #strip.overlay-off #buffline { display: none !important; }

  /* --uiscale grows the chrome as the strip is expanded; --rs grows the big
     readouts/tuner note more aggressively (more camera ⇒ bigger HUD). */
  #strip { position: relative; width: 100%; height: 100vh; min-height: 96px; overflow: hidden;
    --uiscale: 1; --rs: 1; }
  #strip.size-1 { --uiscale: 1.18; --rs: 1.5; }
  #strip.size-2 { --uiscale: 1.36; --rs: 2.1; }
  #strip.size-3 { --uiscale: 1.5;  --rs: 2.6; }

  /* ---- ADAPTIVE palette (default): status colour — green lock / amber / red clip ---- */
  #strip {
    --hot:    #eef6f8;                        /* primary text */
    --accent: #9fc3cc;
    --dim:    rgba(180,205,212,.62);
    --hud-line: rgba(150,190,200,.30);
    --panel:  rgba(8,16,20,.44);
    --glow:   rgba(120,180,150,.4);
    --keyC:   #3ee07f;
    --tempoC: #ffb02e;
    --tuneC:  #9fc3cc;
    --grad:   linear-gradient(0deg,#2fcf6b,#2fcf6b 56%,#ffb02e 80%,#ff3b30);
    --clip:   #ff3b30;
    --buf:    #ff3b30;
    --save:   #ff3b30;
    --saveInk:#fff;
  }
  /* ---- ICE palette: monochrome cyan targeting HUD ---- */
  #strip.theme-ice {
    --hot:    #eafdff;
    --accent: #7fe6ff;
    --dim:    rgba(180,232,246,.62);
    --hud-line: rgba(127,230,255,.30);
    --panel:  rgba(6,16,22,.42);
    --glow:   rgba(90,212,255,.5);
    --keyC:   #9bf0ff;
    --tempoC: #9bf0ff;
    --tuneC:  #7fe6ff;
    --grad:   linear-gradient(0deg,#36d6ff,#36d6ff 54%,#bff4ff 80%,#ff5a52);
    --clip:   #ff5a52;
    --buf:    #ff4d45;
    --save:   #7fe6ff;
    --saveInk:#04222b;
  }

  @keyframes hudSweep { 0% { transform: translateY(-140%); } 100% { transform: translateY(1100%); } }
  @keyframes hudPulse { 0%, 100% { opacity: 1; } 50% { opacity: .22; } }

  /* webcam fills the strip */
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); background: #06080c; }
  #bg { position: absolute; inset: 0; background:
    radial-gradient(120% 95% at 50% 128%, rgba(48,60,70,.85), rgba(12,17,24,.96) 58%, #05070c),
    linear-gradient(158deg, #0a0f17, #0d141d 42%, #111a23 70%, #070a10); }
  #bg::after { content: ""; position: absolute; inset: 0; background:
    radial-gradient(38% 64% at 63% 80%, rgba(255,150,72,.10), transparent 70%),
    radial-gradient(34% 56% at 28% 72%, rgba(64,128,190,.12), transparent 72%); }
  /* warp starfield shown when there's no live camera feed; sits over #bg, under
     the #cam video (which paints above it when active) and the HUD chrome. */
  #hyper { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* decorative HUD chrome — hidden on the clean ("overlay off") feed */
  #hudchrome { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  #grain { position: absolute; inset: 0; opacity: .5; background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px); }
  #sweep { position: absolute; left: 0; right: 0; top: 0; height: 16%;
    background: linear-gradient(180deg, transparent, rgba(150,225,255,.05), transparent);
    animation: hudSweep 7.5s linear infinite; }
  #vignette { position: absolute; inset: 0; background:
    radial-gradient(135% 115% at 50% 50%, transparent 52%, rgba(0,0,0,.6)); }
  .corner { position: absolute; width: calc(15px * var(--uiscale)); height: calc(15px * var(--uiscale)); }
  .corner.tl { top: calc(7px*var(--uiscale)); left: calc(7px*var(--uiscale)); border-top: 1px solid var(--hud-line); border-left: 1px solid var(--hud-line); }
  .corner.tr { top: calc(7px*var(--uiscale)); right: calc(7px*var(--uiscale)); border-top: 1px solid var(--hud-line); border-right: 1px solid var(--hud-line); }
  .corner.bl { bottom: calc(7px*var(--uiscale)); left: calc(7px*var(--uiscale)); border-bottom: 1px solid var(--hud-line); border-left: 1px solid var(--hud-line); }
  .corner.brr{ bottom: calc(7px*var(--uiscale)); right: calc(7px*var(--uiscale)); border-bottom: 1px solid var(--hud-line); border-right: 1px solid var(--hud-line); }

  /* ===== TOP BAND ===== */
  #topstack { position: absolute; top: 0; left: 0; right: 0; z-index: 5; }

  /* ---- tuner tape across the top ---- */
  #tuneBar { display: flex; align-items: center; gap: calc(9px * var(--uiscale));
    padding: calc(6px * var(--uiscale)) calc(13px * var(--uiscale));
    background: linear-gradient(to bottom, rgba(6,12,18,.58), rgba(6,12,18,.06));
    border-bottom: 1px solid var(--hud-line); }
  #tuneBar { --noteC: var(--tuneC); }
  #tuneBar.intune { --noteC: var(--green); }
  #tuneBar.off    { --noteC: var(--red); }
  #tuneBar .tlabel { font-size: calc(7.5px * var(--uiscale)); font-weight: 700; letter-spacing: .16em; color: var(--dim); }
  #tuneBar .tspec  { font-size: calc(7px * var(--uiscale)); letter-spacing: .1em; color: var(--dim); }
  .tScale { position: relative; flex: 1; height: calc(10px * var(--rs));
    background: repeating-linear-gradient(90deg, var(--hud-line) 0 1px, transparent 1px calc(100%/24)); }
  .tZone { position: absolute; left: 45%; right: 45%; top: 0; bottom: 0; background: rgba(120,200,160,.14); }
  .tCenter { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--hud-line); transform: translateX(-50%); }
  /* eased motion so the needle reads calmly */
  .tNeedle { position: absolute; top: calc(-4px * var(--rs)); bottom: calc(-4px * var(--rs)); left: 50%;
    width: calc(2px * var(--rs)); background: var(--noteC); box-shadow: 0 0 calc(9px * var(--rs)) var(--noteC);
    transform: translateX(-50%); transition: left .28s cubic-bezier(.33,0,.2,1), background .2s, box-shadow .2s; }

  /* the note + cents float in a bracketed panel centered below the tape */
  .tNotePanel { position: absolute; left: 50%; top: calc(100% + 5px * var(--rs)); transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: calc(1px * var(--rs));
    padding: calc(5px*var(--rs)) calc(14px*var(--rs)) calc(4px*var(--rs)); background: var(--panel);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); --c: var(--noteC); }
  .tNoteBig { font-family: var(--font-display); font-weight: 700; font-size: calc(18px * var(--rs)); line-height: 1;
    color: var(--noteC); text-shadow: 0 0 calc(12px * var(--rs)) var(--noteC); }
  .tNoteBig .oct { font-size: .55em; color: var(--dim); margin-left: 1px; }
  .tCents { font-size: calc(8.5px * var(--rs)); font-weight: 700; letter-spacing: .05em; color: var(--hot);
    text-shadow: 0 0 calc(6px * var(--rs)) var(--noteC); }

  /* ---- status + KEY/TEMPO row ---- */
  #statusRow { display: flex; align-items: flex-start; gap: calc(12px * var(--uiscale));
    padding: calc(8px * var(--uiscale)) calc(14px * var(--uiscale)) 0; }
  .stat { display: flex; flex-direction: column; gap: calc(3px * var(--uiscale)); }
  .statline { display: flex; align-items: center; gap: calc(6px * var(--uiscale)); }
  .statline .livedot { width: calc(6px*var(--uiscale)); height: calc(6px*var(--uiscale)); border-radius: 50%;
    background: var(--clip); box-shadow: 0 0 calc(8px*var(--uiscale)) var(--clip); animation: hudPulse 1.6s infinite; }
  .statline .brand { font-size: calc(9px*var(--uiscale)); font-weight: 700; letter-spacing: .16em; color: var(--hot); }
  .statline .live  { font-size: calc(8px*var(--uiscale)); letter-spacing: .16em; color: var(--accent); }
  .stat .cam { font-size: calc(9px*var(--uiscale)); color: var(--dim); letter-spacing: .05em; }
  .stat .cam .clk { color: var(--hot); font-weight: 700; }

  .spacer { flex: 1; }

  .readout { position: relative; padding: calc(6px*var(--rs)) calc(13px*var(--rs)); background: var(--panel);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  .readout.key   { --c: var(--keyC); }
  .readout.tempo { --c: var(--tempoC); }
  .br { position: absolute; width: calc(9px*var(--rs)); height: calc(9px*var(--rs)); }
  .br.tl { top: 0; left: 0; border-top: 1px solid var(--c); border-left: 1px solid var(--c); }
  .br.tr { top: 0; right: 0; border-top: 1px solid var(--c); border-right: 1px solid var(--c); }
  .br.bl { bottom: 0; left: 0; border-bottom: 1px solid var(--c); border-left: 1px solid var(--c); }
  .br.brr{ bottom: 0; right: 0; border-bottom: 1px solid var(--c); border-right: 1px solid var(--c); }
  .rhead { display: flex; align-items: center; gap: calc(5px*var(--rs)); margin-bottom: calc(2px*var(--rs)); }
  .rhead .rdot { width: calc(5px*var(--rs)); height: calc(5px*var(--rs)); border-radius: 50%; background: var(--c);
    box-shadow: 0 0 calc(6px*var(--rs)) var(--c); animation: hudPulse 2.6s infinite; }
  .rhead .rl { font-size: calc(8px*var(--uiscale)); font-weight: 700; letter-spacing: .2em; color: var(--dim); }
  .rv { font-family: var(--font-display); font-weight: 700; font-size: calc(22px*var(--rs)); line-height: .92;
    color: var(--c); text-shadow: 0 0 calc(16px*var(--rs)) var(--glow); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .rvwrap { display: flex; align-items: baseline; gap: calc(4px*var(--rs)); }
  .rvwrap .bpm { font-size: calc(8px*var(--uiscale)); font-weight: 700; letter-spacing: .12em; color: var(--dim); }

  /* ===== BOTTOM BAND ===== */
  #botband { position: absolute; left: 0; right: 0; bottom: calc(4px * var(--uiscale)); z-index: 5;
    display: flex; align-items: flex-end; gap: calc(14px * var(--uiscale));
    padding: 0 calc(14px * var(--uiscale)) calc(8px * var(--uiscale)); }

  .meterbox .mhead { display: flex; align-items: baseline; gap: calc(7px*var(--uiscale)); margin-bottom: calc(4px*var(--uiscale)); }
  .meterbox .mlabel { font-size: calc(8px*var(--uiscale)); font-weight: 700; letter-spacing: .18em; color: var(--accent); }
  .meterbox .mspec  { font-size: calc(7.5px*var(--uiscale)); letter-spacing: .08em; color: var(--dim); }
  #vmeters { display: flex; align-items: flex-end; gap: calc(2px * var(--uiscale)); height: calc(26px * var(--uiscale));
    padding-bottom: calc(3px * var(--uiscale)); border-bottom: 1px solid var(--hud-line); }
  #vmeters .bar { width: calc(3.5px * var(--uiscale)); height: 100%; background: rgba(255,255,255,.05);
    display: flex; align-items: flex-end; }
  #vmeters .bar > div { width: 100%; height: 0%; background: var(--grad); transition: height 80ms linear; }

  .actions { display: flex; align-items: center; gap: calc(6px * var(--uiscale)); }
  /* stacked label buttons (tuner / channel / buffer) */
  #tuneBtn, #tuneCh, #bufBtn { cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; line-height: 1.1; height: calc(31px*var(--uiscale)); padding: 0 calc(9px*var(--uiscale));
    background: var(--panel); border: 1px solid var(--hud-line); border-radius: 3px; color: var(--hot);
    font-family: var(--font-mono); font-weight: 700; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  #tuneBtn .bl, #tuneCh .bl, #bufBtn .bl { font-size: calc(6.5px*var(--uiscale)); color: var(--dim); letter-spacing: .14em; }
  #tuneBtn #tuneState, #tuneCh #tuneChVal, #bufBtn #bufVal { font-size: calc(10px*var(--uiscale)); letter-spacing: .06em; }
  #tuneBtn.on { border-color: var(--tuneC); }
  #tuneBtn.on #tuneState { color: var(--tuneC); }

  .sbtn { display: flex; align-items: center; gap: calc(6px*var(--uiscale)); height: calc(31px*var(--uiscale));
    padding: 0 calc(11px*var(--uiscale)); background: var(--panel); border: 1px solid var(--hud-line); border-radius: 3px;
    color: var(--hot); font-family: var(--font-mono); font-weight: 700; font-size: calc(10px*var(--uiscale));
    letter-spacing: .1em; cursor: pointer; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
  #recBtn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: irRingR 1.9s infinite; }
  #recBtn.recording { background: var(--red); border-color: transparent; color: #fff; }
  #recBtn.recording .dot { background: #fff; animation: irPulse 1.2s infinite; }
  #saveBtn { background: var(--save); border: none; color: var(--saveInk); font-family: var(--font-display);
    font-size: calc(11px*var(--uiscale)); letter-spacing: .04em; box-shadow: 0 0 calc(18px*var(--uiscale)) var(--glow); }
  #saveBtn .kbd { font-family: var(--font-mono); font-size: calc(8px*var(--uiscale)); background: rgba(0,0,0,.2);
    padding: 2px 5px; border-radius: 3px; }
  #saveBtn:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .iconBtn { width: calc(31px*var(--uiscale)); height: calc(31px*var(--uiscale)); display: flex; align-items: center;
    justify-content: center; background: var(--panel); border: 1px solid var(--hud-line); border-radius: 3px;
    color: var(--accent); font-size: calc(13px*var(--uiscale)); cursor: pointer;
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }

  /* ===== buffer fill tape ===== */
  #buffline { position: absolute; left: 0; right: 0; bottom: 0; height: calc(3px * var(--uiscale));
    background: rgba(255,255,255,.07); z-index: 5; }
  #bufFill { width: 0%; height: 100%; background: var(--buf); box-shadow: 0 0 calc(9px*var(--uiscale)) var(--buf);
    transition: width .3s linear; }
</style>
</head>
<body>
<div id="strip">
  <div id="bg"></div>
  <canvas id="hyper"></canvas>
  <video id="cam" autoplay muted playsinline hidden></video>

  <!-- decorative HUD chrome (hidden on the clean feed) -->
  <div id="hudchrome">
    <div id="grain"></div>
    <div id="sweep"></div>
    <div id="vignette"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner brr"></div>
  </div>

  <!-- ===== TOP BAND: tuner tape + status/readouts ===== -->
  <div id="topstack">
    <!-- tuner tape -->
    <div id="tuneBar" hidden>
      <span class="tlabel">TUNER</span>
      <div class="tScale">
        <div class="tZone"></div>
        <div class="tCenter"></div>
        <div class="tNeedle" id="tNeedle"></div>
        <div class="tNotePanel">
          <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i>
          <div class="tNoteBig"><span id="tNote">—</span><span class="oct" id="tOct"></span></div>
          <div class="tCents" id="tCents"></div>
        </div>
      </div>
      <span class="tspec">±50¢ · 440Hz</span>
    </div>

    <!-- status + KEY / TEMPO -->
    <div id="statusRow">
      <div class="stat">
        <div class="statline">
          <span class="livedot"></span>
          <span class="brand">IDEA·REC</span>
          <span class="live">// LIVE</span>
        </div>
        <div class="cam">CAM·BUFFER <span class="clk" id="bufClock">0:00</span></div>
      </div>

      <div class="spacer"></div>

      <div class="readout key">
        <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i>
        <div class="rhead"><span class="rdot"></span><span class="rl">KEY</span></div>
        <div class="rv" id="sKey">—</div>
      </div>

      <div class="readout tempo">
        <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br brr"></i>
        <div class="rhead"><span class="rdot"></span><span class="rl">TEMPO</span></div>
        <div class="rvwrap"><span class="rv" id="sBpm">—</span><span class="bpm">BPM</span></div>
      </div>
    </div>
  </div>

  <!-- ===== BOTTOM BAND: meters + actions ===== -->
  <div id="botband">
    <div class="meterbox">
      <div class="mhead"><span class="mlabel">INPUTS</span><span class="mspec" id="meterSpec"></span></div>
      <div id="vmeters"></div>
    </div>

    <div class="spacer"></div>

    <div class="actions">
      <button id="tuneBtn" title="Chromatic tuner on a mono channel">
        <span class="bl">TUNER</span><span id="tuneState">OFF</span>
      </button>
      <button id="tuneCh" title="Tuner channel — click to change" hidden>
        <span class="bl">CH</span><span id="tuneChVal">1</span>
      </button>
      <button id="bufBtn" title="Buffer length — click to change">
        <span class="bl">BUFFER</span><span id="bufVal">1:00</span>
      </button>
      <button id="recBtn" class="sbtn" title="Record continuously"><span class="dot"></span>REC</button>
      <button id="saveBtn" class="sbtn" disabled>Save last 1:00<span class="kbd">␣</span></button>
      <button id="sizeBtn" class="iconBtn" title="Expand / shrink the strip">⤢</button>
      <button id="gear" class="iconBtn" title="Settings &amp; captures">⚙</button>
    </div>
  </div>

  <!-- buffer fill tape -->
  <div id="buffline"><div id="bufFill"></div></div>
</div>

<div class="ir-toast" id="toast"></div>

<script src="/core.js"></script>
<script>
const $ = IR.$, api = IR.api, toast = IR.toast, fmtClock = IR.fmtClock;
let running = false, recording = false, smoothPeaks = [], deviceList = [];
let curDev = null;                 // the input device the strip is listening on
let camId = "";                    // camera deviceId currently in use

const BUF_OPTS = [30, 60, 120, 300];
let bufIdx = 1;
const bufferSeconds = () => BUF_OPTS[bufIdx];
const saveLabel = () => "Save last " + fmtClock(bufferSeconds());

const cam = IR.createCamera({
  previewEl: $("cam"),
  getBufferSeconds: bufferSeconds,
  onEnded: () => { setTimeout(reconcileCam, 800); },  // reacquire if the strip still owns it
});

// Show the live camera when it's running, otherwise run the hyperspace warp in
// its place (no camera connected, or the settings window holds the camera).
const hyper = IR.createHyperspace($("hyper"));
function refreshCamView() {
  const live = cam.isActive();
  $("cam").hidden = !live;
  $("hyper").hidden = live;
  hyper.setActive(!live);
}

// ---- per-channel meters (one thin bar per channel of the selected stream) ----
function buildMeters(n) {
  const box = $("vmeters");
  if (box.childElementCount === n) return;
  box.innerHTML = "";
  smoothPeaks = new Array(n).fill(0);
  for (let i = 0; i < n; i++) {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.innerHTML = "<div></div>";
    box.appendChild(bar);
  }
  const sp = document.getElementById("meterSpec");
  if (sp) sp.textContent = n + " CH";
}

function setReadouts(analysis) {
  const f = IR.formatLive(analysis);
  if (f.key) $("sKey").textContent = f.key.replace(" minor", "m").replace(" major", "");
  if (f.bpm) $("sBpm").textContent = f.bpm;
}

async function poll() {
  if (!running) return;
  try {
    const s = await api("/api/status");
    if (!s.running) { running = false; return; }
    buildMeters(s.channels || 1);
    IR.renderMeters([...$("vmeters").querySelectorAll(".bar > div")], s.peaks || [], smoothPeaks, "height");
    setReadouts(s.analysis);
    recording = !!s.recording;
    $("recBtn").classList.toggle("recording", recording);
    const target = s.seconds || 60;
    $("bufFill").style.width = Math.min(100, (s.filled / target) * 100) + "%";
  } catch (e) { /* keep polling */ }
}

function updateCamClock() {
  refreshCamView();                  // safety net: keep warp/cam in sync
  if (cam.isContinuous()) $("bufClock").textContent = "● " + fmtClock(cam.continuousElapsed());
  else if (cam.isActive()) $("bufClock").textContent = fmtClock(cam.bufferSpan());
}

// ---- listening lifecycle ----
function pickDevice() {
  const remembered = localStorage.getItem("idea-recorder-device");
  return deviceList.find(d => d.name === remembered) ||
         deviceList.find(d => d.default) || deviceList[0];
}

async function startListening() {
  curDev = pickDevice();
  if (!curDev) throw new Error("No input device");
  await api("/api/start", { device: curDev.index, seconds: bufferSeconds() });
  running = true;
  $("saveBtn").disabled = false;
}

async function restartForBuffer() {
  localStorage.setItem("idea-recorder-buffer", bufferSeconds());
  $("bufVal").textContent = fmtClock(bufferSeconds());
  $("saveBtn").firstChild.textContent = saveLabel();
  if (!running) return;
  try { await api("/api/stop", {}); await startListening(); }
  catch (e) { toast(e.message, true); }
}

let camStarting = false;
async function enableCam() {
  if (!cam.pickVideoMime() || cam.isActive() || camStarting) return;
  camStarting = true;
  try {
    camId = localStorage.getItem("idea-recorder-camera") || "";
    await cam.enable(camId);
    refreshCamView();
  } finally { camStarting = false; }
}

// Single-owner hand-off with the settings window: the strip holds the camera
// unless the settings view has claimed it ("ir-cam-owner" === "settings").
// Runs on storage events and on a timer, so it self-heals even if an event is
// missed (e.g. the settings window closing while it held the camera).
function reconcileCam() {
  const owner = localStorage.getItem("ir-cam-owner") || "strip";
  if (owner === "settings") {
    if (cam.isActive()) cam.disable();
  } else {
    if (!cam.isActive()) enableCam().catch(() => {});
  }
  refreshCamView();                    // hyperspace fills in whenever cam is off
}

function bundleChannels() {
  const saved = JSON.parse(localStorage.getItem("idea-recorder-bundle-chans") || "null");
  return saved || [0, 1];
}

// ---- tuner (top overlay) ----
let tunerRunning = false, tunerCh = 0, needleCents = 0;

function deviceChannels() { return curDev ? curDev.channels : 1; }

async function startTuner() {
  if (!curDev) return;
  tunerCh = Math.min(tunerCh, deviceChannels() - 1);
  await api("/api/tuner/start", { device: curDev.index, channel: tunerCh });
  tunerRunning = true;
  $("tuneBar").hidden = false;
  $("tuneCh").hidden = false;
  $("tuneState").textContent = "ON";
  $("tuneBtn").classList.add("on");
  $("tuneChVal").textContent = tunerCh + 1;
}

async function stopTuner() {
  await api("/api/tuner/stop", {});
  tunerRunning = false;
  $("tuneBar").hidden = true;
  $("tuneCh").hidden = true;
  $("tuneState").textContent = "OFF";
  $("tuneBtn").classList.remove("on");
}

function updateTuner(st) {
  const bar = $("tuneBar"), r = st && st.reading;
  if (r && typeof r.cents === "number") {
    const a = Math.round(Math.abs(r.cents));
    $("tNote").textContent = r.note;
    $("tOct").textContent = r.octave;
    $("tCents").textContent = (r.cents > 0 ? "+" : r.cents < 0 ? "−" : "") + a + "¢";
    // Ease the needle toward the reading so it settles calmly instead of darting.
    needleCents += (r.cents - needleCents) * 0.3;
    $("tNeedle").style.left = Math.max(0, Math.min(100, 50 + needleCents)) + "%";
    bar.classList.toggle("intune", a <= 5);
    bar.classList.toggle("off", a > 5);
  } else {
    $("tNote").textContent = "—"; $("tOct").textContent = ""; $("tCents").textContent = "";
    needleCents = 0;
    $("tNeedle").style.left = "50%";
    bar.classList.remove("intune", "off");
  }
}

async function tunerPoll() {
  if (!tunerRunning) return;
  try {
    const st = await api("/api/tuner/status");
    updateTuner(st);
    if (!st.running) { tunerRunning = false; $("tuneBar").hidden = true; $("tuneCh").hidden = true;
      $("tuneState").textContent = "OFF"; $("tuneBtn").classList.remove("on"); }
  } catch (e) { /* keep polling */ }
}

// ---- expand / shrink (preset sizes; the native window resizes via the bridge) ----
let sizeIdx = 0;
function sizeHeights() {
  const avail = screen.availHeight || 900;
  // narrow strip → progressively taller, up to almost the full screen
  return [132, Math.round(avail * 0.34), Math.round(avail * 0.60), Math.round(avail * 0.92)];
}
function applySize() {
  const strip = $("strip");
  strip.classList.remove("size-1", "size-2", "size-3");
  if (sizeIdx > 0) strip.classList.add("size-" + sizeIdx);
  localStorage.setItem("ir-strip-size", sizeIdx);
  const a = window.pywebview && window.pywebview.api;   // resize the real window in the desktop app
  if (a && a.resize_strip) a.resize_strip(sizeHeights()[sizeIdx]);
}

// Show/hide the on-screen overlay (controls + meters). Toggled from the
// settings window via the shared "ir-strip-overlay" flag; the app keeps running.
function applyOverlay() {
  const on = (localStorage.getItem("ir-strip-overlay") || "on") !== "off";
  $("strip").classList.toggle("overlay-off", !on);
}

// Adaptive (status colour) by default; "ice" gives the monochrome cyan HUD.
function applyTheme() {
  $("strip").classList.toggle("theme-ice",
    localStorage.getItem("ir-strip-theme") === "ice");
}

// ---- actions ----
$("bufBtn").onclick = () => { bufIdx = (bufIdx + 1) % BUF_OPTS.length; restartForBuffer(); };
$("sizeBtn").onclick = () => { sizeIdx = (sizeIdx + 1) % 4; applySize(); };

$("tuneBtn").onclick = async () => {
  try { tunerRunning ? await stopTuner() : await startTuner(); }
  catch (e) { toast(e.message, true); }
};

$("tuneCh").onclick = async () => {
  tunerCh = (tunerCh + 1) % deviceChannels();
  $("tuneChVal").textContent = tunerCh + 1;
  localStorage.setItem("idea-recorder-tuner-channel", tunerCh);
  if (tunerRunning) { try { await startTuner(); } catch (e) { toast(e.message, true); } }
};

$("saveBtn").onclick = async () => {
  if (!running) return;
  try {
    const r = await api("/api/save", {});
    if (cam.isActive()) {
      await cam.flush();
      try { await cam.uploadVideo(r.saved, cam.collectSegments(false), bundleChannels()); }
      catch (e) { toast("Audio saved; video failed", true); return; }
    }
    toast("Saved " + r.duration + "s → " + r.saved);
  } catch (e) { toast(e.message, true); }
};

$("recBtn").onclick = async () => {
  try {
    if (recording) {
      const r = await api("/api/record/stop", {});
      if (cam.isActive()) {
        await cam.flush(); cam.stopContinuous();
        try { await cam.uploadVideo(r.saved, cam.collectSegments(true), bundleChannels()); } catch (e) {}
      }
      toast("Recorded " + r.duration + "s → " + r.saved);
    } else {
      await api("/api/record/start", {});
      if (cam.isActive()) cam.startContinuous();
    }
  } catch (e) { toast(e.message, true); }
};

$("gear").onclick = () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.open_dashboard)
    window.pywebview.api.open_dashboard();
  else window.open("/", "_blank");
};

document.addEventListener("keydown", e => {
  if (e.code === "Space" && running && !["BUTTON", "SELECT"].includes(document.activeElement.tagName)) {
    e.preventDefault(); $("saveBtn").click();
  }
});

// Keep the strip synced with choices made in the dashboard ("the menu"): the
// dashboard and strip are separate windows but share localStorage, so a device
// or camera change there drives the strip too (they show the same sources).
window.addEventListener("storage", async (e) => {
  if (e.key === "ir-strip-overlay") {
    applyOverlay();
  } else if (e.key === "ir-strip-theme") {
    applyTheme();
  } else if (e.key === "idea-recorder-buffer") {
    // settings changed the buffer → match it here and restart listening so the
    // strip captures the new length (don't re-persist; that would echo back).
    const secs = +localStorage.getItem("idea-recorder-buffer");
    if (BUF_OPTS.includes(secs) && secs !== bufferSeconds()) {
      bufIdx = BUF_OPTS.indexOf(secs);
      $("bufVal").textContent = fmtClock(bufferSeconds());
      $("saveBtn").firstChild.textContent = saveLabel();
      if (running) { try { await api("/api/stop", {}); await startListening(); } catch (err) {} }
    }
  } else if (e.key === "idea-recorder-device") {
    try { await api("/api/stop", {}); await startListening(); } catch (err) {}
  } else if (e.key === "ir-cam-owner") {
    reconcileCam();
  } else if (e.key === "idea-recorder-camera") {
    const owner = localStorage.getItem("ir-cam-owner") || "strip";
    if (owner === "strip" && (localStorage.getItem("idea-recorder-camera") || "") !== camId) {
      if (cam.isActive()) cam.disable();
      enableCam().catch(() => {});
    }
  }
});

(async () => {
  const savedBuf = +localStorage.getItem("idea-recorder-buffer");
  if (BUF_OPTS.includes(savedBuf)) bufIdx = BUF_OPTS.indexOf(savedBuf);
  tunerCh = +localStorage.getItem("idea-recorder-tuner-channel") || 0;
  const savedSize = +localStorage.getItem("ir-strip-size");
  if (savedSize >= 0 && savedSize <= 3) sizeIdx = savedSize;
  applySize();
  applyOverlay();
  applyTheme();
  refreshCamView();                  // warp on until the camera attaches
  $("bufVal").textContent = fmtClock(bufferSeconds());
  $("saveBtn").firstChild.textContent = saveLabel();
  localStorage.setItem("ir-cam-owner", "strip");   // strip owns the camera by default
  deviceList = await api("/api/devices");
  await startListening();
  try { await enableCam(); } catch (e) { /* camera optional — don't block metering */ }
  setInterval(poll, 150);
  setInterval(tunerPoll, 90);
  setInterval(updateCamClock, 500);
  setInterval(reconcileCam, 1500);   // self-heal the camera hand-off
})().catch(e => toast(e.message, true));
</script>
</body>
</html>
